name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  simple_deployment_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies 
        run: npm install  
      - name: Check style        
        run: npm run eslint
      - name: Run npm test
        run: npm run test
      - name: Run npm build
        run: npm run build
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - name: Trigger deployment
        if: ${{ (github.event_name == 'push') && (!contains(github.event.head_commit.message, '#skip')) }}
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}
      - uses: sarisia/actions-status-discord@v1
        name: Notify success
        if: ${{ success() }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          content: "Deployment successful! A new version deployed to production"
          title: "Deployment details"
          description: |
            Commit: `${{ github.sha }}`
            Message: `${{ github.event.head_commit.message }}`
            Author: `${{ github.actor }}`
        name: Notify failure
        if: ${{ failure() }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          content: "Build failed! The pipeline encountered an error"
          title: "Failure details"
          color: 0xff0000
          description: |
            Repository: `${{ github.repository }}`
            Branch: `${{ github.base_ref }}`
            Commit: `${{ github.sha }}`
            Message: `${{ github.event.head_commit.message }}`
            Author: `${{ github.actor }}`
            Workflow: Deployment pipeline
            Job: simple_deployment_pipeline
  tag_release:
    needs: [simple_deployment_pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Bump version and push tag
        if: ${{ (github.event_name == 'push') && (!contains(github.event.head_commit.message, '#skip')) }}
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch